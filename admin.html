<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f5f6f4;
    --surface: #ffffff;
    --ink: #1c2321;
    --muted: #66706c;
    --line: #dde1de;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --danger: #b3261e;
    --ok-bg: #e3f1ec;
    --draft-bg: #eef0ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131716;
      --surface: #1b211f;
      --ink: #e8ece9;
      --muted: #94a09b;
      --line: #2c3532;
      --accent: #3fb59f;
      --accent-ink: #08201b;
      --danger: #f2877f;
      --ok-bg: #173229;
      --draft-bg: #262d2b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login-box {
    width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px; padding: 28px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
  input[type=text], input[type=email], input[type=password], input[type=url], textarea {
    width: 100%; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  textarea { min-height: 220px; resize: vertical; }

  .btn {
    padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--surface); cursor: pointer; font-weight: 600;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 6px 12px; font-size: .88rem; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .full { width: 100%; margin-top: 20px; }

  header.top {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header.top strong { font-size: 1.05rem; }
  .who { color: var(--muted); font-size: .9rem; margin-right: 12px; }

  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bar h2 { margin: 0; font-size: 1.2rem; }

  .item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px;
    display: flex; gap: 14px; align-items: center; justify-content: space-between;
  }
  .item .info { min-width: 0; }
  .item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .date { color: var(--muted); font-size: .85rem; }
  .item .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .tag {
    display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 99px;
    background: var(--draft-bg); color: var(--muted); margin-right: 8px; font-weight: 600;
  }
  .tag.live { background: var(--ok-bg); color: var(--accent); }

  .empty {
    text-align: center; color: var(--muted); padding: 40px 16px;
    border: 1px dashed var(--line); border-radius: 8px;
  }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-weight: 600; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }
  .preview { max-width: 100%; max-height: 180px; margin-top: 10px; border-radius: 6px; border: 1px solid var(--line); }
  .row-btns { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

  .msg { margin-top: 14px; font-size: .92rem; min-height: 1.2em; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 6px;
    font-size: .92rem; z-index: 10;
  }
  .config-warn {
    background: #fff4d6; color: #4a3a00; border: 1px solid #e6c85a;
    padding: 12px 14px; border-radius: 6px; margin-bottom: 16px; font-size: .92rem;
  }
  @media (max-width: 560px) {
    .item { flex-direction: column; align-items: stretch; }
    .item .actions { justify-content: flex-end; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login-view" class="login-wrap" hidden>
  <div class="login-box">
    <h1>Masuk admin</h1>
    <p class="sub">Gunakan akun admin yang sudah kamu buat di Supabase.</p>
    <div id="config-warn" class="config-warn" hidden>
      Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas script dulu.
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="login-btn" class="btn primary full">Masuk</button>
    <div id="login-msg" class="msg err" role="alert"></div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="app-view" hidden>
  <header class="top">
    <strong>Admin Panel</strong>
    <div>
      <span class="who" id="who"></span>
      <button id="logout-btn" class="btn small">Keluar</button>
    </div>
  </header>

  <main>
    <!-- Daftar -->
    <div id="list-view">
      <div class="bar">
        <h2>Semua konten</h2>
        <button id="new-btn" class="btn primary">Tambah konten</button>
      </div>
      <div id="list"></div>
    </div>

    <!-- Form -->
    <div id="form-view" hidden>
      <div class="bar">
        <h2 id="form-title">Konten baru</h2>
        <button id="back-btn" class="btn small">Kembali</button>
      </div>
      <input type="hidden" id="f-id">
      <label for="f-title">Judul</label>
      <input id="f-title" type="text" maxlength="200">

      <label for="f-image">URL gambar (opsional)</label>
      <input id="f-image" type="url" placeholder="https://...">
      <img id="f-preview" class="preview" alt="Pratinjau gambar" hidden>

      <label for="f-content">Isi</label>
      <textarea id="f-content"></textarea>

      <label class="check"><input id="f-published" type="checkbox" checked> Tampilkan di website</label>

      <div class="row-btns">
        <button id="save-btn" class="btn primary">Simpan</button>
        <button id="cancel-btn" class="btn">Batal</button>
      </div>
      <div id="form-msg" class="msg" role="alert"></div>
    </div>
  </main>
</section>

<div id="toast" hidden></div>

<script>
/* ============ KONFIGURASI (isi dua baris ini) ============ */
const SUPABASE_URL = "https://XXXXXXXX.supabase.co";
const SUPABASE_ANON_KEY = "ISI_ANON_PUBLIC_KEY_KAMU";
const TABLE = "posts";
/* ========================================================== */

const $ = (id) => document.getElementById(id);
const configured = !SUPABASE_URL.includes("XXXXXXXX") && !SUPABASE_ANON_KEY.startsWith("ISI_");
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.hidden = true), 2400);
}

function show(view) {
  $("login-view").hidden = view !== "login";
  $("app-view").hidden = view === "login";
  if (view !== "login") {
    $("list-view").hidden = view !== "list";
    $("form-view").hidden = view !== "form";
  }
}

/* ---------- Auth ---------- */
async function init() {
  if (!configured) {
    $("config-warn").hidden = false;
    show("login");
    return;
  }
  const { data } = await db.auth.getSession();
  if (data.session) enterApp(data.session.user);
  else show("login");
}

function enterApp(user) {
  $("who").textContent = user.email;
  show("list");
  loadList();
}

$("login-btn").addEventListener("click", async () => {
  if (!configured) return;
  const btn = $("login-btn");
  $("login-msg").textContent = "";
  btn.disabled = true;
  const { data, error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value,
  });
  btn.disabled = false;
  if (error) {
    $("login-msg").textContent = "Email atau password salah.";
    return;
  }
  $("password").value = "";
  enterApp(data.user);
});

$("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") $("login-btn").click();
});

$("logout-btn").addEventListener("click", async () => {
  await db.auth.signOut();
  show("login");
});

/* ---------- Daftar ---------- */
function fmtDate(iso) {
  return new Date(iso).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
}

async function loadList() {
  const box = $("list");
  box.textContent = "Memuat...";
  const { data, error } = await db.from(TABLE).select("*").order("created_at", { ascending: false });
  box.textContent = "";
  if (error) {
    box.innerHTML = '<div class="empty">Gagal memuat data. Cek konfigurasi tabel dan izin akses.</div>';
    return;
  }
  if (!data.length) {
    box.innerHTML = '<div class="empty">Belum ada konten. Klik "Tambah konten" untuk membuat yang pertama.</div>';
    return;
  }
  data.forEach((row) => {
    const el = document.createElement("div");
    el.className = "item";

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = row.title;
    const meta = document.createElement("div");
    meta.className = "date";
    const tag = document.createElement("span");
    tag.className = "tag" + (row.published ? " live" : "");
    tag.textContent = row.published ? "Tayang" : "Draf";
    meta.append(tag, "Diperbarui " + fmtDate(row.updated_at || row.created_at));
    info.append(name, meta);

    const actions = document.createElement("div");
    actions.className = "actions";
    const edit = document.createElement("button");
    edit.className = "btn small";
    edit.textContent = "Ubah";
    edit.onclick = () => openForm(row);
    const del = document.createElement("button");
    del.className = "btn small danger";
    del.textContent = "Hapus";
    del.onclick = () => removeRow(row);
    actions.append(edit, del);

    el.append(info, actions);
    box.append(el);
  });
}

async function removeRow(row) {
  if (!confirm('Hapus "' + row.title + '"? Tindakan ini tidak bisa dibatalkan.')) return;
  const { error } = await db.from(TABLE).delete().eq("id", row.id);
  if (error) return toast("Gagal menghapus.");
  toast("Dihapus");
  loadList();
}

/* ---------- Form ---------- */
function openForm(row) {
  $("form-msg").textContent = "";
  $("form-title").textContent = row ? "Ubah konten" : "Konten baru";
  $("f-id").value = row ? row.id : "";
  $("f-title").value = row ? row.title : "";
  $("f-image").value = row && row.image_url ? row.image_url : "";
  $("f-content").value = row ? row.content : "";
  $("f-published").checked = row ? row.published : true;
  updatePreview();
  show("form");
}

function updatePreview() {
  const url = $("f-image").value.trim();
  const img = $("f-preview");
  if (/^https?:\/\//i.test(url)) {
    img.src = url;
    img.hidden = false;
  } else {
    img.hidden = true;
    img.removeAttribute("src");
  }
}
$("f-image").addEventListener("input", updatePreview);
$("f-preview").addEventListener("error", () => ($("f-preview").hidden = true));

$("new-btn").addEventListener("click", () => openForm(null));
$("back-btn").addEventListener("click", () => show("list"));
$("cancel-btn").addEventListener("click", () => show("list"));

$("save-btn").addEventListener("click", async () => {
  const msg = $("form-msg");
  msg.className = "msg err";
  msg.textContent = "";

  const title = $("f-title").value.trim();
  const content = $("f-content").value.trim();
  if (!title) { msg.textContent = "Judul wajib diisi."; return; }
  if (!content) { msg.textContent = "Isi konten wajib diisi."; return; }

  const payload = {
    title,
    content,
    image_url: $("f-image").value.trim() || null,
    published: $("f-published").checked,
    updated_at: new Date().toISOString(),
  };

  const id = $("f-id").value;
  const btn = $("save-btn");
  btn.disabled = true;
  const { error } = id
    ? await db.from(TABLE).update(payload).eq("id", id)
    : await db.from(TABLE).insert(payload);
  btn.disabled = false;

  if (error) { msg.textContent = "Gagal menyimpan. Coba lagi."; return; }
  toast("Tersimpan");
  show("list");
  loadList();
});

init();
</script>
</body>
</html>
