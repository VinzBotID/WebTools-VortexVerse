<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#e6e6e6;padding:16px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:20px;margin:0 0 12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  input[type=password]{flex:1;min-width:200px;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff}
  button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:600;background:#2d6cdf;color:#fff}
  button.sec{background:#2a2f3a}
  button.danger{background:#b3342f}
  button:disabled{opacity:.5;cursor:wait}
  textarea{width:100%;height:55vh;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#e6e6e6;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:2}
  #msg{min-height:22px;margin:8px 0;font-size:14px}
  .ok{color:#4cd07d}.err{color:#ff6b6b}
  iframe{width:100%;height:60vh;border:1px solid #333;border-radius:8px;background:#fff;margin-top:12px;display:none}
  .vip{margin-top:28px;padding-top:16px;border-top:1px solid #333}
  .vip h2{font-size:17px;margin:0 0 10px}
  .vip input{padding:10px;border-radius:8px;border:1px solid #333;background:#1a1d24;color:#fff;flex:1;min-width:120px}
  .vip ul{list-style:none;padding:0;margin:10px 0 0}
  .vip li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:#1a1d24;border-radius:8px;margin-bottom:6px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin: Edit HTML Website</h1>
  <div class="row">
    <input type="password" id="pw" placeholder="Password admin" autocomplete="current-password">
    <button id="load">Muat HTML saat ini</button>
  </div>
  <textarea id="html" spellcheck="false" placeholder="Klik 'Muat HTML saat ini' atau tempel HTML lengkap di sini..."></textarea>
  <div id="msg"></div>
  <div class="row">
    <button id="save">Simpan &amp; Publish</button>
    <button id="preview" class="sec">Preview</button>
    <button id="reset" class="danger">Reset ke default.html</button>
    <a href="/" target="_blank" style="align-self:center;color:#7aa7ff">Buka website ↗</a>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-popups"></iframe>

  <div class="vip">
    <h2>Akun VIP</h2>
    <div class="row">
      <input id="vu" placeholder="username (huruf kecil)" autocapitalize="none">
      <input id="vp" type="text" placeholder="password (min 6)" autocapitalize="none">
      <input id="vd" type="number" min="1" value="30" placeholder="hari">
      <button id="vadd">Tambah / Perbarui</button>
    </div>
    <button id="vlist" class="sec">Muat daftar VIP</button>
    <ul id="vul"></ul>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'err'; };

$('pw').value = sessionStorage.getItem('adm') || '';

async function call(action, extra = {}) {
  const password = $('pw').value;
  const btns = document.querySelectorAll('button');
  btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, password, ...extra })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    sessionStorage.setItem('adm', password);
    return data;
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

$('load').onclick = async () => {
  try {
    const d = await call('load');
    $('html').value = d.html;
    msg(d.source === 'redis' ? 'Dimuat dari database.' : 'Belum ada versi tersimpan, memuat default.html.', true);
  } catch (e) { msg(e.message); }
};

$('save').onclick = async () => {
  if (!$('html').value.trim()) return msg('HTML masih kosong.');
  try {
    const d = await call('save', { html: $('html').value });
    msg('Tersimpan (' + d.bytes + ' bytes). Website akan update dalam ~5 detik.', true);
  } catch (e) { msg(e.message); }
};

$('reset').onclick = async () => {
  if (!confirm('Kembalikan website ke default.html?')) return;
  try {
    await call('reset');
    msg('Direset. Website kembali memakai default.html.', true);
  } catch (e) { msg(e.message); }
};

$('preview').onclick = () => {
  $('frame').style.display = 'block';
  $('frame').srcdoc = $('html').value;
  $('frame').scrollIntoView({ behavior: 'smooth' });
};

$('html').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
});
async function vipCall(payload){
  const r=await fetch('/api/vip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({adminPassword:$('pw').value,...payload})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function vipRefresh(){
  const d=await vipCall({action:'admin_list'});
  const ul=$('vul'); ul.innerHTML='';
  if(!d.users.length){ul.innerHTML='<li>Belum ada akun VIP.</li>';return;}
  d.users.forEach(u=>{
    const li=document.createElement('li');
    const t=document.createElement('span');
    t.textContent=u.username+' - sampai '+new Date(u.expiresAt).toLocaleDateString('id-ID');
    const b=document.createElement('button');
    b.className='danger'; b.textContent='Hapus';
    b.onclick=async()=>{ if(!confirm('Hapus '+u.username+'?'))return;
      try{await vipCall({action:'admin_delete',username:u.username});vipRefresh();}catch(e){msg(e.message);} };
    li.append(t,b); ul.append(li);
  });
}
$('vlist').onclick=async()=>{try{await vipRefresh();msg('Daftar VIP dimuat.',true);}catch(e){msg(e.message);}};
$('vadd').onclick=async()=>{
  try{
    await vipCall({action:'admin_add',username:$('vu').value,password:$('vp').value,days:$('vd').value});
    $('vp').value=''; msg('Akun VIP tersimpan.',true); vipRefresh();
  }catch(e){msg(e.message);}
};
</script>
</body>
</html>
