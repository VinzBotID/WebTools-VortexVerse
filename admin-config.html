
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090812">
<title>ADMIN CONFIG - VORTEX VERSE</title>

<style>
:root{
  --bg:#090812;
  --text:#f7f4ff;
  --muted:#a6a1bb;
  --line:rgba(164,108,255,.45);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(ellipse at 20% -10%,#48205a66,transparent 38%),var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
}
.wrap{max-width:760px;margin:auto;padding:20px 15px 40px}
h1{
  margin:0 0 4px;
  font-size:24px;
  font-weight:950;
  background:linear-gradient(90deg,#70d8ff,#b58aff 65%,#ff6c9c);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.sub{color:var(--muted);font-size:12px;margin:0 0 18px}
.card{
  margin-top:14px;
  padding:18px 15px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(28,25,47,.96),rgba(14,22,37,.97));
}
.card h2{margin:0 0 12px;font-size:16px;font-weight:900}
label{
  display:block;
  margin:0 0 6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}
input{
  width:100%;
  margin-bottom:12px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:#0c0b18;
  color:#fff;
  font-size:14px;
}
input:focus{border-color:#b17cff}
button{
  cursor:pointer;
  border:1px solid #b17cff88;
  border-radius:12px;
  padding:12px 16px;
  background:linear-gradient(100deg,#6d3bba,#3b4a9b);
  color:#fff;
  font-size:14px;
  font-weight:850;
}
button:disabled{opacity:.6;cursor:wait}
button.full{width:100%}
button.ghost{background:#29204a;border-color:var(--line)}
button.del{
  background:#5a1f33;
  border-color:#ff4d8399;
  padding:8px 12px;
  font-size:12px;
}
button.edit{
  background:#29204a;
  border-color:#b17cff;
  padding:8px 12px;
  font-size:12px;
}
.msg{
  min-height:18px;
  margin:10px 0 0;
  font-size:12px;
  text-align:center;
}
.msg.err{color:#ff718a}
.msg.ok{color:#19d6a0}
.preview{
  display:none;
  margin:0 0 12px;
  max-height:220px;
  max-width:100%;
  width:auto;
  border-radius:12px;
  border:1px solid var(--line);
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
#panel{display:none}
.list{display:grid;gap:10px;margin-top:6px}
.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#0c0b1888;
}
.row img{
  width:56px;
  height:74px;
  flex:none;
  object-fit:cover;
  border-radius:9px;
  background:#111020;
}
.row .t{
  flex:1;
  min-width:0;
  font-size:13px;
  font-weight:800;
  overflow-wrap:anywhere;
}
.row .t small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-weight:600;
  font-size:10px;
  overflow-wrap:anywhere;
}
.empty{
  padding:20px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.actions{display:flex;flex-direction:column;gap:6px;flex:none}
@media(max-width:420px){
  .row{gap:8px}
  .row img{width:48px;height:64px}
  .actions button{padding:7px 8px;font-size:11px}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>ADMIN CONFIG</h1>
      <p class="sub">Vortex Verse · kelola foto, judul & link download config</p>
    </div>
    <button class="ghost" id="logoutBtn" type="button" style="display:none">KELUAR</button>
  </div>

  <!-- LOGIN -->
  <section class="card" id="loginCard">
    <h2>🔐 Login Admin</h2>
    <form id="loginForm">
      <label for="pw">Password admin</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="full" type="submit" id="loginBtn">MASUK</button>
    </form>
    <div class="msg" id="loginMsg"></div>
  </section>

  <div id="panel">

    <!-- TAMBAH CONFIG -->
    <section class="card">
      <h2>➕ Tambah Config</h2>

      <form id="addForm">

        <label for="foto">URL Foto Config</label>
        <input
          id="foto"
          type="url"
          placeholder="https://files.catbox.moe/foto.png"
          required
        >

        <img id="preview" class="preview" alt="Preview config">

        <label for="judul">Judul Config</label>
        <input
          id="judul"
          type="text"
          maxlength="120"
          placeholder="Contoh: CONFIG VORTEX V1"
          required
        >

        <label for="link">Link Download</label>
        <input
          id="link"
          type="url"
          placeholder="https://contoh.com/download"
          required
        >

        <button class="full" type="submit" id="addBtn">
          TAMBAH CONFIG
        </button>

      </form>

      <div class="msg" id="addMsg"></div>
    </section>

    <!-- EDIT CONFIG -->
    <section class="card" id="editCard" style="display:none">
      <h2>✏️ Edit Config</h2>

      <form id="editForm">
        <input id="editId" type="hidden">

        <label for="editFoto">URL Foto Baru</label>
        <input id="editFoto" type="url" required>

        <img id="editPreview" class="preview" alt="Preview foto baru">

        <label for="editJudul">Judul Config Baru</label>
        <input id="editJudul" type="text" maxlength="120" required>

        <label for="editLink">Link Download Baru</label>
        <input id="editLink" type="url" required>

        <button class="full" type="submit" id="saveEditBtn">
          SIMPAN PERUBAHAN
        </button>

        <button class="full ghost" type="button" id="cancelEditBtn" style="margin-top:8px">
          BATAL
        </button>
      </form>

      <div class="msg" id="editMsg"></div>
    </section>

    <!-- DAFTAR CONFIG -->
    <section class="card">
      <h2>📋 Daftar Config (<span id="count">0</span>)</h2>
      <div class="list" id="list"></div>
    </section>

  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const KEY = 'vv_admin_pw';
let password = sessionStorage.getItem(KEY) || '';

async function api(method, body) {
  const r = await fetch('/api/config', {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': password
    },
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  });

  const d = await r.json().catch(() => ({}));

  if (!r.ok || d.ok === false) {
    throw new Error(d.error || 'Terjadi kesalahan.');
  }

  return d;
}

function setMsg(el, text, type) {
  el.textContent = text || '';
  el.className = 'msg' + (type ? ' ' + type : '');
}

function showPanel() {
  $('loginCard').style.display = 'none';
  $('panel').style.display = 'block';
  $('logoutBtn').style.display = 'inline-block';
  loadList();
}

function showLogin() {
  $('loginCard').style.display = 'block';
  $('panel').style.display = 'none';
  $('logoutBtn').style.display = 'none';
  closeEdit();
}

async function loadList() {
  try {
    const r = await fetch('/api/config', {cache:'no-store'});
    const d = await r.json();

    if (!r.ok || d.ok === false) {
      throw new Error(d.error || 'Gagal memuat daftar.');
    }

    renderList(d.items || []);

  } catch(e) {
    setMsg($('addMsg'), e.message, 'err');
  }
}

function renderList(items) {
  $('count').textContent = items.length;

  const box = $('list');
  box.innerHTML = '';

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Belum ada config.';
    box.appendChild(empty);
    return;
  }

  items.forEach(c => {
    const row = document.createElement('div');
    row.className = 'row';

    const img = document.createElement('img');
    img.src = c.foto;
    img.alt = '';
    img.loading = 'lazy';

    img.onerror = function() {
      this.onerror = null;
      this.src = 'https://placehold.co/112x148/19172b/b58aff?text=X';
    };

    const info = document.createElement('div');
    info.className = 't';
    info.textContent = c.judul;

    const small = document.createElement('small');
    small.textContent = c.link;
    info.appendChild(small);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'edit';
    edit.textContent = 'EDIT';
    edit.onclick = () => openEdit(c);

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = 'HAPUS';

    del.onclick = async () => {
      if (!confirm('Hapus config "' + c.judul + '"?')) return;

      del.disabled = true;

      try {
        const d = await api('DELETE', {id:c.id});
        renderList(d.items);
        setMsg($('addMsg'), 'Config berhasil dihapus.', 'ok');

        if ($('editId').value === c.id) {
          closeEdit();
        }

      } catch(e) {
        setMsg($('addMsg'), e.message, 'err');
        del.disabled = false;
      }
    };

    actions.append(edit, del);
    row.append(img, info, actions);
    box.appendChild(row);
  });
}

// EDIT CONFIG
function openEdit(c) {
  $('editId').value = c.id;
  $('editFoto').value = c.foto;
  $('editJudul').value = c.judul;
  $('editLink').value = c.link;

  $('editPreview').src = c.foto;
  $('editPreview').style.display = 'block';

  $('editCard').style.display = 'block';
  setMsg($('editMsg'), '');

  $('editCard').scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}

function closeEdit() {
  $('editForm').reset();
  $('editId').value = '';
  $('editPreview').removeAttribute('src');
  $('editPreview').style.display = 'none';
  $('editCard').style.display = 'none';
  setMsg($('editMsg'), '');
}

// LOGIN
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  password = $('pw').value;
  $('loginBtn').disabled = true;
  setMsg($('loginMsg'), 'Memeriksa...');

  try {
    await api('POST', {action:'check'});

    sessionStorage.setItem(KEY, password);
    setMsg($('loginMsg'), '');
    showPanel();

  } catch(err) {
    setMsg($('loginMsg'), err.message, 'err');

  } finally {
    $('loginBtn').disabled = false;
  }
});

// PREVIEW FOTO TAMBAH
$('foto').addEventListener('input', () => {
  const v = $('foto').value.trim();
  const p = $('preview');

  if (/^https?:\/\//i.test(v)) {
    p.src = v;
    p.style.display = 'block';
  } else {
    p.style.display = 'none';
  }
});

$('preview').addEventListener('error', () => {
  $('preview').style.display = 'none';
});

// TAMBAH CONFIG
$('addForm').addEventListener('submit', async e => {
  e.preventDefault();

  $('addBtn').disabled = true;
  setMsg($('addMsg'), 'Menyimpan...');

  try {
    const d = await api('POST', {
      foto: $('foto').value.trim(),
      judul: $('judul').value.trim(),
      link: $('link').value.trim()
    });

    renderList(d.items);

    $('addForm').reset();
    $('preview').removeAttribute('src');
    $('preview').style.display = 'none';

    setMsg($('addMsg'), 'Config berhasil ditambahkan!', 'ok');

  } catch(err) {
    setMsg($('addMsg'), err.message, 'err');

    if (/password admin salah/i.test(err.message)) {
      sessionStorage.removeItem(KEY);
      password = '';
      showLogin();
    }

  } finally {
    $('addBtn').disabled = false;
  }
});

// PREVIEW FOTO EDIT
$('editFoto').addEventListener('input', () => {
  const v = $('editFoto').value.trim();
  const p = $('editPreview');

  if (/^https?:\/\//i.test(v)) {
    p.src = v;
    p.style.display = 'block';
  } else {
    p.style.display = 'none';
  }
});

$('editPreview').addEventListener('error', () => {
  $('editPreview').style.display = 'none';
});

// SIMPAN EDIT
$('editForm').addEventListener('submit', async e => {
  e.preventDefault();

  $('saveEditBtn').disabled = true;
  $('cancelEditBtn').disabled = true;

  setMsg($('editMsg'), 'Menyimpan perubahan...');

  try {
    const d = await api('POST', {
      action:'edit',
      id:$('editId').value,
      foto:$('editFoto').value.trim(),
      judul:$('editJudul').value.trim(),
      link:$('editLink').value.trim()
    });

    renderList(d.items);
    closeEdit();

    setMsg($('addMsg'), 'Config berhasil diperbarui!', 'ok');

  } catch(err) {
    setMsg($('editMsg'), err.message, 'err');

    if (/password admin salah/i.test(err.message)) {
      sessionStorage.removeItem(KEY);
      password = '';
      showLogin();
    }

  } finally {
    $('saveEditBtn').disabled = false;
    $('cancelEditBtn').disabled = false;
  }
});

$('cancelEditBtn').addEventListener('click', closeEdit);

// LOGOUT
$('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem(KEY);
  password = '';
  $('pw').value = '';
  closeEdit();
  showLogin();
});

// LOGIN OTOMATIS SELAMA SESI AKTIF
(async () => {
  if (!password) return;

  try {
    await api('POST', {action:'check'});
    showPanel();
  } catch {
    sessionStorage.removeItem(KEY);
    password = '';
  }
})();
</script>

</body>
</html>
